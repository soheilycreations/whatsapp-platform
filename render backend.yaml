version: "1"
projects:
- name: whatsapp-bot
  environments:
  - name: Production
    services:
    - type: web
      name: whatsapp-bot-backend
      runtime: node
      repo: https://github.com/soheilycreations/whatsapp-platform
      plan: free
      envVars:
      - key: GEMINI_API_KEY
